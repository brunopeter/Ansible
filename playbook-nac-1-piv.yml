---
- name: Compliance Check - PIV Authentication configuration
  # Note: Ansible linter shows error on first line of
  #       playbook when external vault.yml used.
  hosts: "{{ _hosts }}"
  # strategy: ansible.builtin.free
  gather_facts: false
  vars_files:
    - "./inventory/group_vars/all/vault.yml"

  tasks:
    - name: "Configuration blocks"
      ansible.builtin.include_tasks:
        file: "{{ item_task }}"
      loop:
        - "./tasks/facts.yml"
        - "./tasks/set-vars-ntp-tacacs.yml"
        - "./tasks/set-vars-nac.yml"
        ### NAC tasks
        - "./tasks/nac-radius.yml"
        - "./tasks/device-tracking.yml"
        - "./tasks/nac-snmp-users.yml"
        - "./tasks/nac-snmp-remove-old-users.yml"
        - "./tasks/nac-snmp-remove-old-acls.yml"
        ### MFA tasks
        - "./tasks/aaa.yml"
        # - "./tasks/dot-ca-g5.yml"
        # - "./tasks/dot-ca-g6.yml"
        # - "./tasks/ip-ssh-cert.yml"
        - "./tasks/aaa-cleanup.yml"
        ### DIT/DAR FIPS 140
        - "./tasks/ip-ssh-ciphers.yml"
        # - "./tasks/ntp.yml"
      loop_control:
        loop_var: item_task
    
    - name: "NTP Configuration"
      ansible.builtin.include_role:
        name: ntp

      vars:
        ansible_command_timeout: 240

    - name: Save when modified
      cisco.ios.ios_config:
        save_when: modified
        # save_when: changed
