---
- name: AAA new-model
  cisco.ios.ios_config:
    lines:
      - aaa new-model

- name: Tacacs group
  cisco.ios.ios_config:
    parents:
      - aaa group server tacacs+ FAA-ISE
    lines:
      - "server name {{ aaa_server_grp }}"
  loop: "{{ tacacs_servers}}"
  loop_control:
    loop_var: aaa_server_grp

- name: AAA configuration
  cisco.ios.ios_config:
    lines:
      - aaa authentication login default group tacacs+ local
      - aaa authentication enable default enable
      - aaa authorization console
      - aaa authorization exec default group tacacs+ local
      # - aaa authorization network FAA-ISE group tacacs+   ## DO NOT ENABLE, using Radius
      - aaa accounting exec default start-stop group tacacs+
      - aaa accounting system default start-stop group tacacs+
      - no aaa accounting system guarantee-first
      ### NAC Radius settings
      - aaa authentication dot1x default group radius
      - aaa authorization network default group radius 
      - aaa accounting update newinfo periodic 5
      - aaa accounting include auth-profile framed-ip-address
      - aaa accounting include auth-profile framed-ipv6-prefix
      - aaa accounting dot1x default start-stop group radius
